  <style>
    .archive-peek {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .archive-peek.is-open {
      display: flex;
    }

    .archive-peek-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(28, 5, 7, 0.72);
      backdrop-filter: blur(5px);
    }

    .archive-peek-window {
      position: relative;
      z-index: 1;
      width: min(1320px, 96vw);
      height: min(900px, 94vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f5f0e7;
      border: 1px solid rgba(94, 11, 17, 0.24);
      border-radius: 18px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.4);
    }

    .archive-peek-header {
      position: relative;
      z-index: 3;
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 10px 16px 10px 24px;
      background: #f5f0e7;
      border-bottom: 1px solid rgba(94, 11, 17, 0.18);
      color: #5e0b11;
      flex: 0 0 auto;
    }

    .archive-peek-person {
      margin: 0;
      min-width: max-content;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.35rem, 2vw, 1.85rem);
      font-weight: 600;
      line-height: 1;
    }

    .archive-peek-tabs {
      display: flex;
      align-items: center;
      gap: 22px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .archive-peek-tabs::-webkit-scrollbar {
      display: none;
    }

    .archive-peek-tab {
      flex: 0 0 auto;
      padding: 8px 0 6px;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: #5e0b11;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.18rem;
      cursor: pointer;
      opacity: 0.56;
    }

    .archive-peek-tab:hover,
    .archive-peek-tab:focus-visible {
      opacity: 1;
    }

    .archive-peek-tab.is-active {
      border-bottom-color: currentColor;
      font-style: italic;
      opacity: 1;
    }

    .archive-peek-status {
      margin-left: auto;
      color: rgba(94, 11, 17, 0.58);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1rem;
      font-style: italic;
      white-space: nowrap;
    }

    .archive-peek-status:empty {
      display: none;
    }

    .archive-peek-frame-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: #f5f0e7;
    }

    .archive-peek-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f5f0e7;
    }

    .archive-peek-close {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      margin-left: 0;
      padding: 0;
      border: 1px solid rgba(94, 11, 17, 0.45);
      border-radius: 50%;
      background: transparent;
      color: #5e0b11;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      transition:
        opacity 160ms ease,
        visibility 160ms ease,
        transform 160ms ease;
    }

    .archive-peek-close:hover,
    .archive-peek-close:focus-visible {
      background: rgba(94, 11, 17, 0.08);
    }

    .archive-peek-close.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.85);
    }

    body.archive-peek-open {
      overflow: hidden;
    }

    @media (max-width: 760px) {
      .archive-peek {
        padding: 8px;
      }

      .archive-peek-window {
        width: 100%;
        height: 96vh;
        border-radius: 12px;
      }

      .archive-peek-header {
        min-height: 62px;
        gap: 16px;
        padding: 9px 10px 9px 16px;
      }

      .archive-peek-person {
        font-size: 1.25rem;
      }

      .archive-peek-tabs {
        gap: 16px;
      }

      .archive-peek-tab {
        font-size: 1.05rem;
      }

      .archive-peek-status {
        display: none;
      }

      .archive-peek-close {
        width: 38px;
        height: 38px;
      }
    }
  </style>

<script>
  const menuToggle =
    document.querySelector(".menu-toggle");

  const mobileMenu =
    document.querySelector(".mobile-menu");

  const paperSection =
    document.querySelector(".paper-section");


  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener(
      "click",
      () => {
        const isOpen =
          mobileMenu.classList.toggle("open");

        menuToggle.setAttribute(
          "aria-expanded",
          String(isOpen)
        );
      }
    );
  }


  function updateMenuColor() {
    /*
      This page currently does not contain a menu toggle.
      Stop immediately if either required element is absent.
    */
    if (!menuToggle || !paperSection) {
      return;
    }

    const menuRect =
      menuToggle.getBoundingClientRect();

    const paperRect =
      paperSection.getBoundingClientRect();

    const menuCenter =
      menuRect.top +
      menuRect.height / 2;

    if (paperRect.top <= menuCenter) {
      menuToggle.classList.add("menu-dark");
      menuToggle.classList.remove("menu-light");
    } else {
      menuToggle.classList.add("menu-light");
      menuToggle.classList.remove("menu-dark");
    }
  }


  if (menuToggle && paperSection) {
    window.addEventListener(
      "scroll",
      updateMenuColor
    );

    window.addEventListener(
      "resize",
      updateMenuColor
    );

    updateMenuColor();
  }


</script>

<script>
  const DROPBOX_API_BASE =
    "https://family-photo-api.emilyzohar.workers.dev";

  const DROPBOX_WORKS_FOLDER =
    "/Zohar Family/Works";

  const PERSONAL_PAGE_SECTIONS = [
    {
      key: "works",
      label: "Works",
      page: "archive.html"
    },
    {
      key: "recipes",
      label: "Recipes",
      page: "recipes.html",
      folder: "Recipes"
    },
    {
      key: "merch",
      label: "Merch",
      page: "merch.html",
      folder: "Merch"
    },
    {
      key: "memories",
      label: "Memories",
      page: "memories.html",
      folder: "Memories"
    },
    {
      key: "travel",
      label: "Travel",
      page: "travel.html",
      folder: "Travel"
    }
  ];

  const archivePeek =
    document.getElementById("archivePeek");

  const archivePeekFrame =
    document.getElementById("archivePeekFrame");

  const archivePeekTabs =
    document.getElementById("archivePeekTabs");

  const archivePeekPerson =
    document.getElementById("archivePeekPerson");

  const archivePeekStatus =
    document.getElementById("archivePeekStatus");

  const archivePeekClose =
    document.querySelector(".archive-peek-close");

  let activePersonalSections = [];
  let activePersonalSectionKey = "works";
  let activeWorksFolderName = "";
  let personalSectionRequestId = 0;


  function normalizePersonName(value) {
    return String(value ?? "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "");
  }


  function cleanDropboxFolderName(value) {
    return String(value ?? "")
      .replace(/[\\/]+/g, "")
      .trim();
  }


  function buildDropboxApiUrl(
    endpoint,
    parameters = {}
  ) {
    const url =
      new URL(
        endpoint,
        `${DROPBOX_API_BASE}/`
      );

    Object.entries(parameters)
      .forEach(
        ([key, value]) => {
          url.searchParams.set(
            key,
            String(value)
          );
        }
      );

    return url.toString();
  }


  function buildPersonalPageUrl(section) {
    const person =
      cleanDropboxFolderName(
        activeWorksFolderName
      );

    if (!person) {
      return "about:blank";
    }

    const parameters =
      new URLSearchParams();

    parameters.set(
      "person",
      person
    );

    parameters.set(
      "peek",
      "true"
    );

    if (
      section.key !== "works" &&
      section.actualFolderName
    ) {
      parameters.set(
        "section",
        section.actualFolderName
      );
    }

    return `${section.page}?${parameters.toString()}`;
  }


  function renderPersonalSectionTabs() {
    if (!archivePeekTabs) {
      return;
    }

    archivePeekTabs.innerHTML = "";

    activePersonalSections.forEach(
      section => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "archive-peek-tab";
        button.dataset.personalSection =
          section.key;
        button.textContent =
          section.label;

        const isActive =
          section.key ===
          activePersonalSectionKey;

        button.classList.toggle(
          "is-active",
          isActive
        );

        button.setAttribute(
          "aria-pressed",
          String(isActive)
        );

        archivePeekTabs.appendChild(
          button
        );
      }
    );
  }


  function showPersonalSection(sectionKey) {
    const section =
      activePersonalSections.find(
        candidate =>
          candidate.key === sectionKey
      );

    if (!section || !archivePeekFrame) {
      return;
    }

    activePersonalSectionKey =
      section.key;

    renderPersonalSectionTabs();

    archivePeekFrame.src =
      buildPersonalPageUrl(section);

    archivePeekFrame.title =
      `${archivePeekPerson?.textContent || "Family"} ${section.label}`;
  }


  async function getPersonalSections(
    worksFolderName
  ) {
    const safeFolderName =
      cleanDropboxFolderName(
        worksFolderName
      );

    const sections = [
      {
        ...PERSONAL_PAGE_SECTIONS[0]
      }
    ];

    if (!safeFolderName) {
      return sections;
    }

    const response =
      await fetch(
        buildDropboxApiUrl(
          "folder",
          {
            path:
              `${DROPBOX_WORKS_FOLDER}/${safeFolderName}`
          }
        )
      );

    if (!response.ok) {
      throw new Error(
        `Could not inspect ${safeFolderName}'s personal folders. HTTP ${response.status}.`
      );
    }

    const entries =
      await response.json();

    const foldersByNormalizedName =
      new Map();

    entries
      .filter(
        entry =>
          String(entry.type ?? "")
            .toLowerCase() === "folder"
      )
      .forEach(
        folder => {
          foldersByNormalizedName.set(
            normalizePersonName(
              folder.name
            ),
            folder.name
          );
        }
      );

    PERSONAL_PAGE_SECTIONS
      .slice(1)
      .forEach(
        section => {
          const actualFolderName =
            foldersByNormalizedName.get(
              normalizePersonName(
                section.folder
              )
            );

          if (!actualFolderName) {
            return;
          }

          sections.push({
            ...section,
            actualFolderName
          });
        }
      );

    return sections;
  }


  async function connectWorksFoldersToTree() {
    const people = [
      ...document.querySelectorAll(
        ".tree-person[data-person]"
      )
    ];

    people.forEach(
      personElement => {
        personElement.removeAttribute(
          "href"
        );

        personElement.classList.remove(
          "has-page"
        );

        personElement.removeAttribute(
          "aria-label"
        );

        delete personElement.dataset.worksFolder;
      }
    );

    try {
      const response =
        await fetch(
          buildDropboxApiUrl(
            "folder",
            {
              path:
                DROPBOX_WORKS_FOLDER
            }
          )
        );

      if (!response.ok) {
        throw new Error(
          `Could not load Works folders. HTTP ${response.status}.`
        );
      }

      const entries =
        await response.json();

      const foldersByName =
        new Map();

      entries
        .filter(
          entry =>
            String(entry.type ?? "")
              .toLowerCase() === "folder"
        )
        .forEach(
          folder => {
            foldersByName.set(
              normalizePersonName(
                folder.name
              ),
              folder.name
            );
          }
        );

      people.forEach(
        personElement => {
          const requestedFolderName =
            personElement.dataset.workPerson ||
            personElement.dataset.person;

          const matchingFolderName =
            foldersByName.get(
              normalizePersonName(
                requestedFolderName
              )
            );

          if (!matchingFolderName) {
            return;
          }

          personElement.href =
            `archive.html?person=${encodeURIComponent(
              matchingFolderName
            )}&peek=true`;

          personElement.dataset.worksFolder =
            matchingFolderName;

          personElement.classList.add(
            "has-page"
          );

          personElement.setAttribute(
            "aria-label",
            `Open ${personElement.textContent.trim()}'s family pages`
          );
        }
      );
    }

    catch (error) {
      console.error(
        "Could not connect Works folders to the family tree:",
        error
      );
    }
  }


  async function openArchivePeek(
    worksFolderName,
    displayName
  ) {
    if (
      !archivePeek ||
      !archivePeekFrame ||
      !archivePeekTabs
    ) {
      return;
    }

    const requestId =
      ++personalSectionRequestId;

    activeWorksFolderName =
      cleanDropboxFolderName(
        worksFolderName
      );

    activePersonalSectionKey =
      "works";

    activePersonalSections = [
      {
        ...PERSONAL_PAGE_SECTIONS[0]
      }
    ];

    if (archivePeekPerson) {
      archivePeekPerson.textContent =
        String(displayName || worksFolderName || "Family")
          .trim();
    }

    if (archivePeekStatus) {
      archivePeekStatus.textContent =
        "Checking pages…";
    }

    renderPersonalSectionTabs();
    showPersonalSection("works");

    archivePeek.classList.add(
      "is-open"
    );

    archivePeek.setAttribute(
      "aria-hidden",
      "false"
    );

    document.body.classList.add(
      "archive-peek-open"
    );

    archivePeekClose?.focus();

    try {
      const sections =
        await getPersonalSections(
          activeWorksFolderName
        );

      if (
        requestId !==
        personalSectionRequestId
      ) {
        return;
      }

      activePersonalSections =
        sections;

      renderPersonalSectionTabs();
    }

    catch (error) {
      console.error(
        "Could not load personalized page tabs:",
        error
      );
    }

    finally {
      if (
        requestId ===
        personalSectionRequestId &&
        archivePeekStatus
      ) {
        archivePeekStatus.textContent =
          "";
      }
    }
  }


  function closeArchivePeek() {
    if (
      !archivePeek ||
      !archivePeekFrame
    ) {
      return;
    }

    personalSectionRequestId += 1;

    archivePeek.classList.remove(
      "is-open"
    );

    archivePeek.setAttribute(
      "aria-hidden",
      "true"
    );

    document.body.classList.remove(
      "archive-peek-open"
    );

    archivePeekClose?.classList.remove(
      "is-hidden"
    );

    archivePeekFrame.src =
      "about:blank";

    if (archivePeekTabs) {
      archivePeekTabs.innerHTML =
        "";
    }

    if (archivePeekStatus) {
      archivePeekStatus.textContent =
        "";
    }
  }


  window.addEventListener(
    "message",
    event => {
      if (
        event.origin !==
        window.location.origin
      ) {
        return;
      }

      if (
        event.data?.type !==
        "archive-preview-state"
      ) {
        return;
      }

      archivePeekClose?.classList.toggle(
        "is-hidden",
        Boolean(
          event.data.isOpen
        )
      );
    }
  );


  document.addEventListener(
    "click",
    event => {
      const personLink =
        event.target.closest(
          ".tree-person.has-page"
        );

      if (personLink) {
        event.preventDefault();

        openArchivePeek(
          personLink.dataset.worksFolder ||
          personLink.dataset.workPerson ||
          personLink.dataset.person,
          personLink.textContent.trim()
        );

        return;
      }

      const sectionButton =
        event.target.closest(
          "[data-personal-section]"
        );

      if (
        sectionButton &&
        archivePeek?.contains(
          sectionButton
        )
      ) {
        showPersonalSection(
          sectionButton.dataset.personalSection
        );

        return;
      }

      if (
        event.target.closest(
          "[data-close-archive-peek]"
        )
      ) {
        closeArchivePeek();
      }
    }
  );


  document.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Escape" &&
        archivePeek?.classList.contains(
          "is-open"
        )
      ) {
        closeArchivePeek();
      }
    }
  );


  connectWorksFoldersToTree();
</script>

    "assets/faves/tweens.png",
    "assets/faves/yal-alon-couch.png",
    "assets/faves/yal-ball.png",
    "assets/faves/yal-on-bike.png",
    "assets/faves/yal-sabba.png",
    "assets/faves/yal-tree.png",
    "assets/faves/yal-wedding-sabba.png"
  ];


  function shuffleHomePhotos(
    photos
  ) {
    const shuffled =
      [...photos];

    for (
      let index =
        shuffled.length - 1;

      index > 0;

      index -= 1
    ) {
      const randomIndex =
        Math.floor(
          Math.random() *
          (index + 1)
        );

      [
        shuffled[index],
        shuffled[randomIndex]
      ] = [
        shuffled[randomIndex],
        shuffled[index]
      ];
    }

    return shuffled;
  }


  function createPhotoAltText(
    path,
    index
  ) {
    const filename =
      path
        .split("/")
        .pop()
        .replace(
          /\.[^.]+$/,
          ""
        )
        .replace(
          /[-_]+/g,
          " "
        );

    return filename
      ? filename
      : `Family photograph ${index + 1}`;
  }


  function loadHomePhotoStack() {
    const stack =
      document.getElementById(
        "home-photo-stack"
      );

    if (
      !stack
    ) {
      return;
    }

    const positions = [
  { x: "-500px", y: "-125px", rotation: "-8deg" },
  { x: "-330px", y: "-145px", rotation: "5deg" },
  { x: "-165px", y: "-130px", rotation: "-4deg" },
  { x: "0px", y: "-145px", rotation: "7deg" },
  { x: "165px", y: "-130px", rotation: "-6deg" },
  { x: "330px", y: "-145px", rotation: "4deg" },
  { x: "500px", y: "-120px", rotation: "-5deg" },

  { x: "-525px", y: "25px", rotation: "6deg" },
  { x: "-350px", y: "5px", rotation: "-3deg" },
  { x: "-175px", y: "20px", rotation: "4deg" },
  { x: "0px", y: "0px", rotation: "-7deg" },
  { x: "175px", y: "18px", rotation: "3deg" },
  { x: "350px", y: "3px", rotation: "-5deg" },
  { x: "525px", y: "25px", rotation: "6deg" },

  { x: "-410px", y: "165px", rotation: "-4deg" },
  { x: "-205px", y: "180px", rotation: "6deg" },
  { x: "0px", y: "165px", rotation: "-2deg" },
  { x: "205px", y: "180px", rotation: "5deg" },
  { x: "410px", y: "165px", rotation: "-7deg" }
];
    const photos =
      shuffleHomePhotos(
        HOME_PHOTOS
      )
        .slice(
          0,
          positions.length
        );

    stack.innerHTML =
      "";

    photos.forEach(
      (
        photoPath,
        index
      ) => {
        const position =
          positions[index];

        const image =
          document.createElement(
            "img"
          );

        image.className =
          "home-stack-photo";

        image.src =
          photoPath;

        image.alt =
          createPhotoAltText(
            photoPath,
            index
          );

        image.loading =
          index < 4
            ? "eager"
            : "lazy";

        image.tabIndex =
          0;

        image.style.setProperty(
          "--photo-x",
          position.x
        );

        image.style.setProperty(
          "--photo-y",
          position.y
        );

        image.style.setProperty(
          "--photo-rotation",
          position.rotation
        );

        image.style.zIndex =
          String(index + 1);

        image.addEventListener(
          "error",
          () => {
            console.error(
              `Could not load ${photoPath}`
            );

            image.remove();
          }
        );

        stack.appendChild(
          image
        );
      }
    );

    if (
      photos.length === 0
    ) {
      stack.innerHTML = `
        <p class="home-photo-message">
          No family photographs have been added yet.
        </p>
      `;
    }
  }


  loadHomePhotoStack();
</script>

</body>
</html>
