  <script>
  const menuToggle = document.querySelector(".menu-toggle");
  const mobileMenu = document.querySelector(".mobile-menu");
  const paperSection = document.querySelector(".paper-section");

  // Open and close menu
  menuToggle.addEventListener("click", () => {
    const isOpen = mobileMenu.classList.toggle("open");

    menuToggle.setAttribute(
      "aria-expanded",
      isOpen
    );
  });

  // Change hamburger colour depending on background
  function updateMenuColor() {
    const menuRect = menuToggle.getBoundingClientRect();
    const paperRect = paperSection.getBoundingClientRect();

    const menuCenter =
      menuRect.top + menuRect.height / 2;

    // Has the paper section moved behind the hamburger?
    if (paperRect.top <= menuCenter) {
      menuToggle.classList.add("menu-dark");
      menuToggle.classList.remove("menu-light");
    } else {
      menuToggle.classList.add("menu-light");
      menuToggle.classList.remove("menu-dark");
    }
  }

  window.addEventListener("scroll", updateMenuColor);
  window.addEventListener("resize", updateMenuColor);

  updateMenuColor();


</script>

<script>
  const DROPBOX_API_BASE =
    "https://family-photo-api.emilyzohar.workers.dev";

  const DROPBOX_WORKS_FOLDER =
    "/Zohar Family/Works";


  function normalizePersonName(value) {
    return String(value ?? "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .replace(
        /[^a-z0-9]+/g,
        ""
      );
  }


  function buildDropboxApiUrl(
    endpoint,
    parameters = {}
  ) {
    const url =
      new URL(
        endpoint,
        `${DROPBOX_API_BASE}/`
      );

    Object.entries(parameters)
      .forEach(
        ([key, value]) => {
          url.searchParams.set(
            key,
            String(value)
          );
        }
      );

    return url.toString();
  }


  async function connectWorksFoldersToTree() {
    const people = [
      ...document.querySelectorAll(
        ".tree-person[data-person]"
      )
    ];

    /*
      Start with every name non-clickable.
    */

    people.forEach(
      personElement => {
        personElement.removeAttribute(
          "href"
        );

        personElement.classList.remove(
          "has-page"
        );

        personElement.removeAttribute(
          "aria-label"
        );
      }
    );

    try {
      const url =
        buildDropboxApiUrl(
          "folder",
          {
            path:
              DROPBOX_WORKS_FOLDER
          }
        );

      const response =
        await fetch(url);

      if (
        !response.ok
      ) {
        throw new Error(
          `Could not load Works folders. HTTP ${response.status}.`
        );
      }

      const entries =
        await response.json();

      const foldersByName =
        new Map();

      entries
        .filter(
          entry =>
            entry.type === "folder"
        )
        .forEach(
          folder => {
            foldersByName.set(
              normalizePersonName(
                folder.name
              ),
              folder.name
            );
          }
        );

      people.forEach(
        personElement => {
          const personName =
            personElement.dataset.person;

          const matchingFolderName =
            foldersByName.get(
              normalizePersonName(
                personName
              )
            );

          if (
            !matchingFolderName
          ) {
            return;
          }

          personElement.href =
            `archive.html?person=${encodeURIComponent(
              matchingFolderName
            )}`;

          personElement.classList.add(
            "has-page"
          );

          personElement.setAttribute(
            "aria-label",
            `Open ${personName}'s works`
          );
        }
      );
    }

    catch (error) {
      console.error(
        "Could not connect Works folders to the family tree:",
        error
      );
    }
  }


  connectWorksFoldersToTree();
</script>
