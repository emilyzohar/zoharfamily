    .archive-peek-close {
  transition:
    opacity 160ms ease,
    visibility 160ms ease,
    transform 160ms ease;
}

.archive-peek-close.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(0.85);
}
    .archive-peek {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .archive-peek.is-open {
      display: flex;
    }

    .archive-peek-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(28, 5, 7, 0.72);
      backdrop-filter: blur(5px);
    }

    .archive-peek-window {
      position: relative;
      z-index: 1;
      width: min(1180px, 94vw);
      height: min(860px, 92vh);
      overflow: hidden;
      background: #681116;
      border: 1px solid rgba(251, 236, 216, 0.55);
      border-radius: 18px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.4);
    }

    .archive-peek-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #681116;
    }

    .archive-peek-close {
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 2;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(251, 236, 216, 0.65);
      border-radius: 50%;
      background: #681116;
      color: #fbecd8;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
    }

    body.archive-peek-open {
      overflow: hidden;
    }

    @media (max-width: 700px) {
      .archive-peek { padding: 10px; }
      .archive-peek-window { width: 100%; height: 94vh; border-radius: 12px; }
    }
  </style>

<script>
  const menuToggle =
    document.querySelector(".menu-toggle");

  const mobileMenu =
    document.querySelector(".mobile-menu");

  const paperSection =
    document.querySelector(".paper-section");


  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener(
      "click",
      () => {
        const isOpen =
          mobileMenu.classList.toggle("open");

        menuToggle.setAttribute(
          "aria-expanded",
          String(isOpen)
        );
      }
    );
  }


  function updateMenuColor() {
    /*
      This page currently does not contain a menu toggle.
      Stop immediately if either required element is absent.
    */
    if (!menuToggle || !paperSection) {
      return;
    }

    const menuRect =
      menuToggle.getBoundingClientRect();

    const paperRect =
      paperSection.getBoundingClientRect();

    const menuCenter =
      menuRect.top +
      menuRect.height / 2;

    if (paperRect.top <= menuCenter) {
      menuToggle.classList.add("menu-dark");
      menuToggle.classList.remove("menu-light");
    } else {
      menuToggle.classList.add("menu-light");
      menuToggle.classList.remove("menu-dark");
    }
  }


  if (menuToggle && paperSection) {
    window.addEventListener(
      "scroll",
      updateMenuColor
    );

    window.addEventListener(
      "resize",
      updateMenuColor
    );

    updateMenuColor();
  }


</script>

<script>
  const DROPBOX_API_BASE =
    "https://family-photo-api.emilyzohar.workers.dev";

  const DROPBOX_WORKS_FOLDER =
    "/Zohar Family/Works";


  function normalizePersonName(value) {
    return String(value ?? "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .replace(
        /[^a-z0-9]+/g,
        ""
      );
  }


  function buildDropboxApiUrl(
    endpoint,
    parameters = {}
  ) {
    const url =
      new URL(
        endpoint,
        `${DROPBOX_API_BASE}/`
      );

    Object.entries(parameters)
      .forEach(
        ([key, value]) => {
          url.searchParams.set(
            key,
            String(value)
          );
        }
      );

    return url.toString();
  }


  async function connectWorksFoldersToTree() {
    const people = [
      ...document.querySelectorAll(
        ".tree-person[data-person]"
      )
    ];

    /*
      Start with every name non-clickable.
    */

    people.forEach(
      personElement => {
        personElement.removeAttribute(
          "href"
        );

        personElement.classList.remove(
          "has-page"
        );

        personElement.removeAttribute(
          "aria-label"
        );
      }
    );

    try {
      const url =
        buildDropboxApiUrl(
          "folder",
          {
            path:
              DROPBOX_WORKS_FOLDER
          }
        );

      const response =
        await fetch(url);

      if (
        !response.ok
      ) {
        throw new Error(
          `Could not load Works folders. HTTP ${response.status}.`
        );
      }

      const entries =
        await response.json();

      const foldersByName =
        new Map();

      entries
        .filter(
          entry =>
            entry.type === "folder"
        )
        .forEach(
          folder => {
            foldersByName.set(
              normalizePersonName(
                folder.name
              ),
              folder.name
            );
          }
        );

      people.forEach(
        personElement => {
          const personName =
            personElement.dataset.person;

          const matchingFolderName =
            foldersByName.get(
              normalizePersonName(
                personName
              )
            );

          if (
            !matchingFolderName
          ) {
            return;
          }

          personElement.href =
  `archive.html?person=${encodeURIComponent(
    matchingFolderName
  )}&peek=true`;

          personElement.classList.add(
            "has-page"
          );

          personElement.setAttribute(
            "aria-label",
            `Open ${personName}'s works`
          );
        }
      );
    }

    catch (error) {
      console.error(
        "Could not connect Works folders to the family tree:",
        error
      );
    }
  }


  connectWorksFoldersToTree();

  const archivePeek = document.getElementById("archivePeek");
  const archivePeekFrame = document.getElementById("archivePeekFrame");

  const archivePeekClose =
  document.querySelector(
    ".archive-peek-close"
  );


window.addEventListener(
  "message",
  event => {
    /*
      Only accept messages from this website.
    */
    if (
      event.origin !==
      window.location.origin
    ) {
      return;
    }

    if (
      event.data?.type !==
      "archive-preview-state"
    ) {
      return;
    }

    archivePeekClose?.classList.toggle(
      "is-hidden",
      Boolean(
        event.data.isOpen
      )
    );
  }
);

  function openArchivePeek(url, personName) {
    if (!archivePeek || !archivePeekFrame) return;

    archivePeekFrame.src = url;
    archivePeekFrame.title = `${personName || "Family"} archive`;
    archivePeek.classList.add("is-open");
    archivePeek.setAttribute("aria-hidden", "false");
    document.body.classList.add("archive-peek-open");
  }

  function closeArchivePeek() {
  if (
    !archivePeek ||
    !archivePeekFrame
  ) {
    return;
  }

  archivePeek.classList.remove(
    "is-open"
  );

  archivePeek.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.classList.remove(
    "archive-peek-open"
  );

  archivePeekClose?.classList.remove(
    "is-hidden"
  );

  archivePeekFrame.src =
    "about:blank";
}
  document.addEventListener("click", event => {
    const personLink = event.target.closest(".tree-person.has-page");

    if (personLink) {
      event.preventDefault();
      openArchivePeek(personLink.href, personLink.dataset.person);
      return;
    }

    if (event.target.closest("[data-close-archive-peek]")) {
      closeArchivePeek();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && archivePeek?.classList.contains("is-open")) {
      closeArchivePeek();
    }
  });
</script>

<script>
  const HOME_PHOTOS = [
    "assets/faves/alon-frown.png",
    "assets/faves/coby-yael-kids.png",
    "assets/faves/family-photo.png",
    "assets/faves/house-coat.png",
    "assets/faves/house.png",
    "assets/faves/kids in coats.png",
    "assets/faves/matching-haircut.png",
    "assets/faves/new-baby.png",
    "assets/faves/newly-weds.png",
    "assets/faves/park.png",
    "assets/faves/sabba-driving.png",
    "assets/faves/siblings.png",
    "assets/faves/tennis.png",
    "assets/faves/tweens.png",
    "assets/faves/yal-alon-couch.png",
    "assets/faves/yal-ball.png",
    "assets/faves/yal-on-bike.png",
    "assets/faves/yal-sabba.png",
    "assets/faves/yal-tree.png",
    "assets/faves/yal-wedding-sabba.png"
  ];


  function shuffleHomePhotos(
    photos
  ) {
    const shuffled =
      [...photos];

    for (
      let index =
        shuffled.length - 1;

      index > 0;

      index -= 1
    ) {
      const randomIndex =
        Math.floor(
          Math.random() *
          (index + 1)
        );

      [
        shuffled[index],
        shuffled[randomIndex]
      ] = [
        shuffled[randomIndex],
        shuffled[index]
      ];
    }

    return shuffled;
  }


  function createPhotoAltText(
    path,
    index
  ) {
    const filename =
      path
        .split("/")
        .pop()
        .replace(
          /\.[^.]+$/,
          ""
        )
        .replace(
          /[-_]+/g,
          " "
        );

    return filename
      ? filename
      : `Family photograph ${index + 1}`;
  }


  function loadHomePhotoStack() {
    const stack =
      document.getElementById(
        "home-photo-stack"
      );

    if (
      !stack
    ) {
      return;
    }

    const positions = [
  { x: "-500px", y: "-125px", rotation: "-8deg" },
  { x: "-330px", y: "-145px", rotation: "5deg" },
  { x: "-165px", y: "-130px", rotation: "-4deg" },
  { x: "0px", y: "-145px", rotation: "7deg" },
  { x: "165px", y: "-130px", rotation: "-6deg" },
  { x: "330px", y: "-145px", rotation: "4deg" },
  { x: "500px", y: "-120px", rotation: "-5deg" },

  { x: "-525px", y: "25px", rotation: "6deg" },
  { x: "-350px", y: "5px", rotation: "-3deg" },
  { x: "-175px", y: "20px", rotation: "4deg" },
  { x: "0px", y: "0px", rotation: "-7deg" },
  { x: "175px", y: "18px", rotation: "3deg" },
  { x: "350px", y: "3px", rotation: "-5deg" },
  { x: "525px", y: "25px", rotation: "6deg" },

  { x: "-410px", y: "165px", rotation: "-4deg" },
  { x: "-205px", y: "180px", rotation: "6deg" },
  { x: "0px", y: "165px", rotation: "-2deg" },
  { x: "205px", y: "180px", rotation: "5deg" },
  { x: "410px", y: "165px", rotation: "-7deg" }
];
    const photos =
      shuffleHomePhotos(
        HOME_PHOTOS
      )
        .slice(
          0,
          positions.length
        );

    stack.innerHTML =
      "";

    photos.forEach(
      (
        photoPath,
        index
      ) => {
        const position =
          positions[index];

        const image =
          document.createElement(
            "img"
          );

        image.className =
          "home-stack-photo";

        image.src =
          photoPath;

        image.alt =
          createPhotoAltText(
            photoPath,
            index
          );

        image.loading =
          index < 4
            ? "eager"
            : "lazy";

        image.tabIndex =
          0;

        image.style.setProperty(
          "--photo-x",
          position.x
        );

        image.style.setProperty(
          "--photo-y",
          position.y
        );

        image.style.setProperty(
          "--photo-rotation",
          position.rotation
        );

        image.style.zIndex =
          String(index + 1);

        image.addEventListener(
          "error",
          () => {
            console.error(
              `Could not load ${photoPath}`
            );

            image.remove();
          }
        );

        stack.appendChild(
          image
        );
      }
    );

    if (
      photos.length === 0
    ) {
      stack.innerHTML = `
        <p class="home-photo-message">
          No family photographs have been added yet.
        </p>
      `;
    }
  }


  loadHomePhotoStack();
</script>
