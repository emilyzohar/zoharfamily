<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Travel | Zohar Family</title>


  <!-- Shared site styles -->

  <link
    rel="stylesheet"
    href="styles.css"
  />


  <!-- Travel-only styles -->

  <link
    rel="stylesheet"
    href="travel.css"
  />

</head>


<body class="travel-page">


  <!-- =========================================
       TOP NAVIGATION
  ========================================== -->

  <header class="travel-header">

    <nav
      class="top-nav-inner"
      aria-label="Main navigation"
    >

      <a
        class="top-nav-link"
        href="index.html"
      >
        Home
      </a>


      <a
        class="top-nav-link"
        href="recipes.html"
      >
        Recipes
      </a>


      <a
        class="top-nav-link"
        href="merch.html"
      >
        Merch
      </a>


      <a
        class="top-nav-link active"
        href="travel.html"
        aria-current="page"
      >
        Travel
      </a>


      <a
        class="top-nav-link"
        href="memories.html"
      >
        Memories
      </a>

       <a class="top-nav-link" href="archive.html">Sabba's Works</a>

    </nav>

  </header>



  <!-- =========================================
       MAP
  ========================================== -->

  <main class="travel-main">


    <div class="travel-map-wrap">


      <!-- WORLD MAP -->

      <img
        id="travel-map"
        class="travel-map"
        src="assets/travel/world.svg"
        alt="World map showing family travels"
      />


      <!--
        Travel pins are created automatically
        by travel.js from travel-data.js
      -->

      <div
        id="travel-pins"
        class="travel-pins"
        aria-label="Travel locations"
      ></div>


      <!--
        Development helper:
        Alt / Option + click on the map
        to reveal x/y percentage coordinates.
      -->

      <div
        id="coordinate-helper"
        class="coordinate-helper"
        hidden
      ></div>


    </div>


    <p class="travel-map-note">
      Select a year to view the trip.
    </p>


  </main>



  <!-- =========================================
       TRAVEL MODAL
  ========================================== -->

  <div
    id="travel-modal"
    class="travel-modal"
    aria-hidden="true"
  >


    <!-- BACKDROP -->

    <div
      id="travel-modal-backdrop"
      class="travel-modal-backdrop"
    ></div>



    <!-- CLOSE BUTTON -->

    <button
      id="travel-modal-close"
      class="travel-modal-close"
      type="button"
      aria-label="Close trip"
    >
      ×
    </button>



    <!-- TRIP CONTENT -->

    <section
      class="travel-modal-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="travel-modal-title"
    >


      <!-- =====================================
           TOP INFORMATION
      ====================================== -->

      <header class="travel-modal-header">

  <div class="travel-modal-info">

    <div class="travel-modal-title-row">

      <h1
        id="travel-modal-title"
        class="travel-modal-title"
      ></h1>

      <span
        id="travel-modal-year"
        class="travel-modal-year"
      ></span>

    </div>

    <p
      id="travel-modal-travelers"
      class="travel-modal-travelers"
    ></p>

    <p
      id="travel-modal-blurb"
      class="travel-modal-blurb"
      hidden
    ></p>

  </div>


  <div class="travel-pdf-links-wrap">

    <h2>
      Trip Documents
    </h2>

    <div
      id="travel-pdf-links"
      class="travel-pdf-links"
    ></div>

  </div>

</header>



      <!-- =====================================
           IMAGE CAROUSEL
      ====================================== -->

      <div class="travel-carousel">


        <!-- Previous image -->

        <button
          id="travel-image-prev"
          class="travel-carousel-arrow travel-carousel-arrow-left"
          type="button"
          aria-label="Previous image"
        ></button>



        <!-- Current image -->

        <div class="travel-carousel-stage">


          <img
            id="travel-carousel-image"
            class="travel-carousel-image"
            src=""
            alt=""
          />


        </div>



        <!-- Next image -->

        <button
          id="travel-image-next"
          class="travel-carousel-arrow travel-carousel-arrow-right"
          type="button"
          aria-label="Next image"
        ></button>


      </div>



      <!-- =====================================
           IMAGE COUNTER
      ====================================== -->

      <div
        id="travel-image-counter"
        class="travel-image-counter"
        aria-live="polite"
      ></div>



      <!-- =====================================
           IMAGE CAROUSEL DOTS
      ====================================== -->

      <div
        id="travel-image-dots"
        class="travel-image-dots"
        aria-label="Choose travel image"
      ></div>




    </section>


  </div>



  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer class="bottom-nav">

    <nav
      class="bottom-nav-inner"
      aria-label="Footer navigation"
    >

      <a href="index.html">
        Home
      </a>


      <a href="recipes.html">
        Recipes
      </a>


      <a href="merch.html">
        Merch
      </a>


      <a
        class="active"
        href="travel.html"
        aria-current="page"
      >
        Travel
      </a>


      <a href="memories.html">
        Memories
      </a>

    </nav>

  </footer>



  <!-- =========================================
       DATA
       Must load before travel.js
  ========================================== -->

  <script src="travel-data.js"></script>



  <!-- =========================================
       PAGE LOGIC
  ========================================== -->

  <script src="travel.js"></script>


</body>

</html>
